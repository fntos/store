<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تيليجرام الجاهز</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #3b82f6;
            --accent-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 40px;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        header h1 { font-size: 1.3rem; }
        header p { font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px; }

        .container { max-width: 600px; margin: 0 auto; }

        .section-title {
            font-size: 1rem;
            margin-bottom: 10px;
            font-weight: 700;
            border-right: 4px solid var(--primary-color);
            padding-right: 8px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img { width: 100%; height: 110px; background-color: #334155; }
        .product-info { padding: 8px; }
        .product-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .product-price { font-size: 0.85rem; color: var(--accent-color); font-weight: 700; margin-bottom: 8px; }

        .add-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .checkout-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .cart-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .cart-total { color: var(--accent-color); }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .payment-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .payment-select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
        }

        .checkout-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            width: 100%;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>متجرك الرقمي</h1>
            <p>أفضل المنتجات والخدمات بين يديك مباشرة</p>
        </header>

        <h2 class="section-title">المنتجات المتوفرة</h2>
        
        <div class="products-grid">
            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-info">
                    <div class="product-title">اشتراك نتفلكس شهر</div>
                    <div class="product-price">5 USD</div>
                    <button class="add-btn" onclick="addToCart('اشتراك نتفلكس شهر', 5)">إضافة للسلة</button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img"></div>
                <div class="product-info">
                    <div class="product-title">بطاقة جوجل بلاي 10</div>
                    <div class="product-price">10.5 USD</div>
                    <button class="add-btn" onclick="addToCart('بطاقة جوجل بلاي 10', 10.5)">إضافة للسلة</button>
                </div>
            </div>
        </div>

        <div class="checkout-box">
            <div class="cart-info">
                <span>المنتجات: <span id="cart-count">0</span></span>
                <span>المجموع: <span class="cart-total" id="cart-total">0 USD</span></span>
            </div>

            <div class="payment-methods">
                <span class="payment-label">اختر طريقة الدفع:</span>
                <select id="payment-select" class="payment-select">
                    <option value="زين كاش (Zain Cash)">زين كاش (Zain Cash)</option>
                    <option value="آسيا حوالة (Asia Hawala)">آسيا حوالة (Asia Hawala)</option>
                    <option value="ماستركارد (Mastercard)">ماستركارد (Mastercard)</option>
                    <option value="رصيد تليفون">رصيد تليفون</option>
                </select>
            </div>
        </div>

        <a id="checkout-link" href="#" class="checkout-btn" onclick="prepareCheckout(event)">إتمام الطلب والدفع 💳</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        let cartItems = [];
        let cartTotal = 0;
        let botUsername = "Fntos1_bot"; // يوزر بوتك الحقيقي

        function addToCart(productName, price) {
            cartItems.push({name: productName, price: price});
            cartTotal += price;
            
            document.getElementById('cart-count').innerText = cartItems.length;
            document.getElementById('cart-total').innerText = cartTotal.toFixed(2) + ' USD';
            
            try { tg.HapticFeedback.impactOccurred('medium'); } catch(e) {}
        }

        function prepareCheckout(event) {
            if (cartItems.length === 0) {
                event.preventDefault();
                alert("السلة فارغة، أضف منتجاً أولاً!");
                return;
            }

            let selectedPayment = document.getElementById('payment-select').value;

            let orderSummary = "طلب جديد من المتجر:\n";
            cartItems.forEach((item, index) => {
                orderSummary += (index + 1) + ". " + item.name + " - " + item.price + " USD\n";
            });
            orderSummary += "\nالمجموع الكلي: " + cartTotal.toFixed(2) + " USD";
            orderSummary += "\nطريقة الدفع: " + selectedPayment;
            orderSummary += "\nالحالة: تم الدفع وتأكيد الطلب";

            let encodedText = encodeURIComponent(orderSummary);
            let telegramUrl = `https://t.me/${botUsername}?text=${encodedText}`;
            
            document.getElementById('checkout-link').href = telegramUrl;
        }
    </script>
</body>
</html>
