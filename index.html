<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fntos Empire - المتجر</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #475569;
        }
        .product-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            text-align: center;
        }
        button {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:active {
            background-color: #4f46e5;
        }
        .cart-summary {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #334155;
        }
        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            border: 1px solid #475569;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>FNTO$ EMPIRE ⚡</h2>
        <p>متجرك الرقمي المتطور للأقوى دائماً</p>
    </div>

    <!-- المنتجات -->
    <div class="product-card">
        <h3>💎 شدات ببجي 660</h3>
        <p>USD 9.99</p>
        <button onclick="addToCart('شدات ببجي 660', 9.99)">إضافة للسلة</button>
    </div>

    <div class="product-card">
        <h3>👑 اشتراك فيبر بريميوم</h3>
        <p>USD 7.50</p>
        <button onclick="addToCart('اشتراك فيبر بريميوم', 7.50)">إضافة للسلة</button>
    </div>

    <!-- ملخص السلة -->
    <div class="cart-summary">
        <p>المنتجات المضافة: <span id="total-items">0</span></p>
        <p>الإجمالي: <span id="total-price">USD 0.00</span></p>
        
        <label for="payment-method">طريقة الدفع المعتمدة:</label>
        <select id="payment-method">
            <option value="Zain Cash">زين كاش (Zain Cash)</option>
            <option value="Asia Hawala">آسيا حولة (Asia Hawala)</option>
            <option value="MasterCard">ماستر كارد (MasterCard)</option>
        </select>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let cart = [];

        // إعداد زر تيليجرام الرسمي في أسفل الشاشة
        const mainButton = tg.MainButton;
        mainButton.text = "إتمام الطلب والدفع الفوري 🚀";
        mainButton.color = "#10b981";
        mainButton.textColor = "#ffffff";

        function addToCart(name, price) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            cart.push({ name, price });
            updateCartUI();
        }

        function updateCartUI() {
            const totalItemsEl = document.getElementById('total-items');
            const totalPriceEl = document.getElementById('total-price');
            
            if (totalItemsEl) totalItemsEl.innerText = cart.length;
            
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            if (totalPriceEl) totalPriceEl.innerText = `USD ${total.toFixed(2)}`;

            // إظهار الزر الرسمي في أسفل التطبيق تلقائياً بمجرد إضافة منتجات
            if (cart.length > 0) {
                mainButton.show();
            } else {
                mainButton.hide();
            }
        }

        // عند الضغط على زر تيليجرام الرسمي أسفل الشاشة
        mainButton.onClick(function () {
            if (cart.length === 0) return;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }

            const paymentSelect = document.getElementById('payment-method');
            const paymentMethod = paymentSelect ? paymentSelect.value : 'Zain Cash';
            
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            let itemsList = cart.map(item => `- ${item.name} ($${item.price})`).join('\n');
            
            const message = `🛒 طلب جديد من Fntos Empire:\n\n${itemsList}\n\n💵 الإجمالي: $${total.toFixed(2)}\n💳 طريقة الدفع: ${paymentMethod}`;
            
            const botUsername = "FNTOS1_bot";
            const encodedMessage = encodeURIComponent(message);
            
            // تحويل المستخدم لشات البوت وإغلاق الويب أب
            const targetUrl = `https://t.me/${botUsername}?start=${encodedMessage}`;
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(targetUrl);
                tg.close();
            } else {
                window.location.href = targetUrl;
            }
        });
    </script>
</body>
</html>
